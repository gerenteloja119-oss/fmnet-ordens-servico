<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FM NET — Ordens de Serviço</title><style>body{font:16px system-ui;background:#f2f6fc;color:#18304e;margin:0}header{background:#103c77;color:white;padding:22px}main{max-width:850px;margin:25px auto;padding:12px}.card{background:white;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 3px 16px #0001}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:12px;margin:7px 0 16px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{background:#1764bc;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin:5px}label{font-weight:600}.hidden{display:none}.order{border-top:1px solid #ddd;padding:16px 0}#msg{color:#a22}.print{display:none}@media print{header,#login,#panel,#msg{display:none!important}.print{display:block}body{background:white}}</style><header><strong>FM NET — Ordens de Serviço</strong></header><main><p id="msg"></p><section id="login" class="card"><h2>Acesso restrito</h2><form id="loginForm"><label>Usuário<input name="username" value="admin" required></label><label>Senha<input name="password" type="password" required></label><button>Entrar</button></form></section><section id="panel" class="hidden"><button id="logout">Sair</button><div class="card"><h2>Abrir ordem de serviço</h2><form id="newForm"><label>Nome do cliente<input name="name" required maxlength="150"></label><label>Endereço<input name="address" required maxlength="300"></label><label>Telefone<input name="phone" required maxlength="40"></label><label>Descrição do serviço<textarea name="description" maxlength="1500"></textarea></label><p>Data e hora registradas automaticamente.</p><button>Cadastrar OS</button></form></div><div class="card"><h2>Ordens cadastradas</h2><input id="search" placeholder="Pesquisar por nome, telefone ou número"><div id="orders"></div></div></section><section id="print" class="print"></section></main><script>
let token='',orders=[];const el=id=>document.getElementById(id),msg=s=>el('msg').textContent=s;async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','x-csrf-token':token}});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha na operação');return j}function add(parent,tag,txt){const x=document.createElement(tag);x.textContent=txt;parent.append(x);return x}function date(d){return new Date(d).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})}function logged(v){el('login').classList.toggle('hidden',v);el('panel').classList.toggle('hidden',!v)}async function reload(){orders=await api('/api/orders');render()}function render(){const q=el('search').value.toLowerCase(),root=el('orders');root.replaceChildren();for(const o of orders.filter(o=>[o.name,o.phone,String(o.id)].some(x=>x.toLowerCase().includes(q)))){const c=document.createElement('div');c.className='order';add(c,'h3',`OS #${o.id} — ${o.name}`);for(const [k,v] of [['Endereço',o.address],['Telefone',o.phone],['Abertura',date(o.created_at)],['Descrição',o.description||'Não informada']])add(c,'p',`${k}: ${v}`);const s=document.createElement('select');for(const v of ['Aberta','Em andamento','Concluída'])s.add(new Option(v,v));s.value=o.status;s.onchange=async()=>{try{await api('/api/orders/'+o.id,{method:'PATCH',body:JSON.stringify({status:s.value})});reload()}catch(e){msg(e.message)}};c.append(s);const b=add(c,'button','Imprimir OS');b.onclick=()=>{const p=el('print');p.replaceChildren();add(p,'h1','FM NET — Ordem de Serviço');for(const [k,v] of [['Número',o.id],['Cliente',o.name],['Endereço',o.address],['Telefone',o.phone],['Data e hora',date(o.created_at)],['Serviço',o.description],['Status',o.status]])add(p,'p',`${k}: ${v}`);add(p,'p','Assinatura: ___________________________');window.print()};root.append(c)}if(!root.children.length)add(root,'p','Nenhuma ordem encontrada.')}el('loginForm').onsubmit=async e=>{e.preventDefault();try{const j=await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=j.csrf;logged(true);await reload();msg('')}catch(err){msg(err.message)}};el('newForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/orders',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();await reload();msg('Ordem cadastrada com sucesso')}catch(err){msg(err.message)}};el('search').oninput=render;el('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});token='';logged(false)};(async()=>{try{const s=await api('/api/session');if(s.authenticated){token=s.csrf;logged(true);await reload()}}catch(e){msg('Servidor indisponível')}})();</script></html>
